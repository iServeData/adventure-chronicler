# Adventure Chronicler changelog: the one place changes are written down.
# CHANGELOG.md is built from this file by `python3 tools/build_changelog.py` (CI runs it with --check), and a
# QuestersBoard add-on page can show this file directly, in the same layout as the QuestersBoard changelog.
# Keep the wording plain and about what players can do.
#
# [[release]]  version = "X.Y.Z", date = "YYYY-MM-DD", title = short headline, status = "prototype" | "released"
#   [[release.change]]  area = one of AREAS in tools/build_changelog.py, kind = "new" | "improved" | "fixed",
#                       text = one or two sentences

[[release]]
version = "0.2.6"
date = "2026-11-24"
title = "Quick buttons on the recording indicator"
status = "prototype"
[[release.change]]
area = "Recorder"
kind = "new"
text = "The REC / PAUSED indicator has a row of small buttons: Add note, Bookmark, Pause (Resume while paused), Stop (asks first), Export and Review, each with a tooltip. `/ac set buttons off` hides the row."

[[release]]
version = "0.2.5"
date = "2026-11-24"
title = "Rename sessions in Review"
status = "prototype"
[[release.change]]
area = "Review"
kind = "new"
text = "Sessions can be renamed in the review window, including stopped ones: click the title or Rename, type, and press Enter (Escape keeps the old name). Only the title changes."
[[release.change]]
area = "Export"
kind = "improved"
text = "The Open QuestersBoard button has a default address, the placeholder `https://example.com/import`, so it works before you set your own. `/ac link https://...` replaces it and `/ac link clear` goes back to the default."

[[release]]
version = "0.2.4"
date = "2026-11-24"
title = "Export as Markdown, Text or JSON"
status = "prototype"
[[release.change]]
area = "Export"
kind = "new"
text = "The export window has a Format row: Import code (the checked code QuestersBoard reads), Markdown, Text and JSON. The last three are readable copies to keep as a file; WoW doesn't let add-ons save files, so the window suggests a file name for you to paste into. Only the import code can be imported."
[[release.change]]
area = "Export"
kind = "new"
text = "The readable copies follow the same privacy settings as the import code: no chat, no other players, and no character name unless you turned it on. Notes are written out in full, and paused or missing time is shown."
[[release.change]]
area = "Export"
kind = "new"
text = "An Open QuestersBoard button. WoW doesn't let add-ons open a browser, so it shows your community's QuestersBoard address ready to copy. Set it once with `/ac link https://...` (https only); it's saved with your settings on your computer."

[[release]]
version = "0.2.3"
date = "2026-11-24"
title = "Notes open on top"
status = "prototype"
[[release.change]]
area = "Notes"
kind = "fixed"
text = "A note opened while the export window is showing comes up on top of it. Of the two, whichever was opened or clicked last is in front."
[[release.change]]
area = "Recorder"
kind = "fixed"
text = "The recorder's short list leaves out the repeat count, which got cut off (\"[+1 re...\"). The review window still shows it, as \"[+1 repeat]\" or \"[+2 repeats]\"."

[[release]]
version = "0.2.2"
date = "2026-11-24"
title = "Rename while recording, one death at a time"
status = "prototype"
[[release.change]]
area = "Recorder"
kind = "new"
text = "The session title can be changed while recording: click it in the recorder, type, and press Enter (Escape keeps the old name). `/ac title <name>` does the same. Renaming doesn't change any observations."
[[release.change]]
area = "Recorder"
kind = "fixed"
text = "Boats, zeppelins and the moment after a reload no longer log the continent (for example \"Arrived in Eastern Kingdoms\") as a place you arrived in. The next real zone is logged instead."
[[release.change]]
area = "Recorder"
kind = "fixed"
text = "A death is logged once even when the client reports it twice. Another death is logged only after you've been alive in between (released and came back, or were resurrected)."
[[release.change]]
area = "Review"
kind = "fixed"
text = "A bookmark with no label shows as \"Bookmark\" in the review list, without a trailing colon."

[[release]]
version = "0.2.1"
date = "2026-11-24"
title = "The add-on's own look"
status = "prototype"
[[release.change]]
area = "Windows"
kind = "improved"
text = "The recorder, review, note and export windows use the add-on's own look from the mock instead of the stock frames: dark panel with a double gold border, compass emblem, serif titles, weathered parchment for the session title, a gold timeline with icons, and tall Add note, Stop (red) and Export buttons."
[[release.change]]
area = "Windows"
kind = "improved"
text = "The artwork is drawn by `tools/gen_textures.py` and shipped as TGA files in `media/`. Nothing is copied from the mock or from Blizzard files."
[[release.change]]
area = "Windows"
kind = "fixed"
text = "Long timeline entries end with \"...\" inside the window instead of running past the edge."

[[release]]
version = "0.2.0"
date = "2026-11-24"
title = "Recorder window"
status = "prototype"
[[release.change]]
area = "Recorder"
kind = "new"
text = "A recorder window, following panel 1 of the approved mock. `/ac` on its own, the REC indicator and the add-on menu open it. It shows whether recording is on, the session title, recorded time and the latest three entries, with Add note, Stop and Export, plus Pause, Bookmark and Review all. With no session open you can name one and press Start."
[[release.change]]
area = "Recorder"
kind = "improved"
text = "Stop asks first, because a stopped session can't be resumed."
[[release.change]]
area = "Settings"
kind = "new"
text = "`/ac help` lists the commands. `/ac review` still opens the full review window."

[[release]]
version = "0.1.1"
date = "2026-11-24"
title = "Fixes from the first in-game tests"
status = "prototype"
[[release.change]]
area = "Recorder"
kind = "fixed"
text = "Taking a flight path no longer logs the same zone arrival twice."
[[release.change]]
area = "Export"
kind = "fixed"
text = "The export window stays on top of the review window instead of letting its rows show through."
[[release.change]]
area = "Screenshots"
kind = "improved"
text = "Clean scene also hides the minimap and the names shown above characters, pets and NPCs, and restores the exact previous values afterwards. A minimap you'd already hidden stays hidden."
[[release.change]]
area = "Screenshots"
kind = "new"
text = "After each screenshot, a chat message says it was saved and roughly when (the time it was requested), so the file is easy to find in the Screenshots folder."
[[release.change]]
area = "Review"
kind = "fixed"
text = "Review no longer shows a bookmark twice."

[[release]]
version = "0.1.0"
date = "2026-11-24"
title = "First prototype"
status = "prototype"
[[release.change]]
area = "Recorder"
kind = "new"
text = "First prototype for WoW Forever (interface 16001). Sessions you start yourself: start, pause, resume, stop, crash and reload recovery, and honest gaps for time that wasn't recorded."
[[release.change]]
area = "Recorder"
kind = "new"
text = "Records zones, instances, encounters, quest turn-ins and reward choices, battleground results and your own deaths. Personal loot is off by default."
[[release.change]]
area = "Notes"
kind = "new"
text = "Notes and bookmarks that are never silently cut off, and a review window where you can delete entries."
[[release.change]]
area = "Screenshots"
kind = "new"
text = "Screenshots \"as seen\" and \"clean scene\". Clean scene restores the interface exactly afterwards."
[[release.change]]
area = "Export"
kind = "new"
text = "The ACX1 export with a CRC-32 checksum, a versioned JSON schema, a reference validator and a fixed story scaffold."
