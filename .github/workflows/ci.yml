# Checks only: lint, mocked tests, schema and hygiene. Nothing is published or deployed.
name: ci
on:
  push:
    branches: [prototype, main]
  pull_request:
permissions:
  contents: read

jobs:
  lua:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Lua 5.1 (the version WoW uses), busted and luacheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1 liblua5.1-0-dev luarocks
          sudo luarocks --lua-version=5.1 install busted 2.2.0-1
          sudo luarocks --lua-version=5.1 install luacheck 1.2.0-1
      - run: luacheck .
      - run: busted
      - run: python3 tools/build_zip.py

  python:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s reference/tests -v
      - run: python tools/gen_schema.py --check

  hygiene:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: python3 tools/hygiene_check.py
      - name: gitleaks (full history)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
          ./gitleaks git --redact --no-banner --exit-code 1 .
